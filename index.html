<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Rocket Race</title>
  <style>
    :root {
      --sky1: #70d9ff;
      --sky2: #dffbff;
      --grass: #71d778;
      --track: #4a5d74;
      --track2: #25364c;
      --gold: #ffd45f;
      --text: #173d69;
      --pink: #ff7bb8;
      --orange: #ffaf4d;
      --blue: #6ec6ff;
      --green: #77e0a2;
      --purple: #b39dff;
      --panel: rgba(255,255,255,0.76);
      --shadow: rgba(15, 58, 114, 0.18);
      --accent: #ff5e7d;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      background: linear-gradient(var(--sky1), var(--sky2));
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game {
      position: relative;
      width: min(96vw, 1200px);
      height: min(92vh, 760px);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(10, 63, 125, 0.25);
      border: 6px solid rgba(255, 255, 255, 0.55);
      background: linear-gradient(#8fe2ff, #d8f6ff 49%, #d5f4b3 49%, #9fe28d 100%);
      perspective: 1200px;
      user-select: none;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 35;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(255,255,255,0.8);
      border: 4px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      font-weight: 900;
      font-size: clamp(16px, 1.7vw, 24px);
      letter-spacing: 0.04em;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(32, 70, 122, 0.15);
    }

    .star {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(#ffe16d, #ffba18);
      font-size: 18px;
      box-shadow: inset 0 -3px 7px rgba(0,0,0,0.08);
    }

    .streak-box {
      background: linear-gradient(135deg, #ff82aa, #ff5a7e);
      color: white;
      animation: pulse 0.8s ease-in-out infinite;
    }

    .race-meter {
      position: absolute;
      left: 50%;
      top: 74px;
      transform: translateX(-50%);
      width: min(78%, 700px);
      height: 30px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      border: 4px solid rgba(255,255,255,0.8);
      box-shadow: 0 8px 16px rgba(18, 68, 135, 0.15);
      z-index: 30;
      overflow: hidden;
    }

    .race-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8de38e, #74d8ff 45%, #ffd66c 100%);
      transition: width 0.25s ease;
    }

    .race-finish {
      position: absolute;
      right: 18px;
      top: 8px;
      bottom: 8px;
      width: 54px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      border-radius: 12px;
      background: linear-gradient(#ff7da7, #ff4d6b);
      border: 3px solid rgba(255,255,255,0.7);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.25);
    }

    .panel {
      position: absolute;
      left: 30px;
      top: 120px;
      z-index: 30;
      max-width: 260px;
      background: rgba(255,255,255,0.7);
      border: 4px solid rgba(255,255,255,0.8);
      border-radius: 22px;
      box-shadow: 0 12px 24px rgba(28, 78, 137, 0.12);
      padding: 12px 14px;
    }

    .panel h4 {
      margin: 0 0 8px 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .powerups {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .power-btn {
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #8be3ff, #63c7ff);
      color: #103b6b;
      font-weight: 900;
      font-size: 16px;
      padding: 10px 12px;
      cursor: pointer;
      box-shadow: 0 8px 14px rgba(27, 96, 166, 0.14);
    }

    .power-btn:hover { transform: translateY(-1px); }

    .power-btn.boost { background: linear-gradient(180deg, #ffd670, #ffb43d); }
    .power-btn.shield { background: linear-gradient(180deg, #9ef2b7, #5dd48d); }
    .power-btn.double { background: linear-gradient(180deg, #d9b4ff, #a581ff); }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .sun {
      position: absolute;
      width: 140px;
      height: 140px;
      right: 80px;
      top: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff8b0, #ffe088 35%, #ffbf2b 65%, #ff8d16 100%);
      box-shadow: 0 0 36px rgba(255, 193, 54, 0.8);
      animation: sunGlow 2.1s ease-in-out infinite alternate;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.8);
      border-radius: 999px;
      opacity: 0.9;
      box-shadow: 26px 10px 0 8px rgba(255,255,255,0.72), 74px 20px 0 8px rgba(255,255,255,0.7), 110px 0 0 20px rgba(255,255,255,0.66);
      animation: drift 22s linear infinite alternate;
    }

    .cloud.one { width: 160px; height: 44px; left: 35px; top: 120px; }
    .cloud.two { width: 180px; height: 46px; left: 300px; top: 170px; animation-delay: 0.7s; }
    .cloud.three { width: 160px; height: 44px; right: 180px; top: 170px; animation-delay: 1.3s; }

    .track-wrap {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(70vw, 720px);
      height: 68%;
      transform: translateX(-50%) rotateX(58deg);
      transform-style: preserve-3d;
      perspective: 900px;
      z-index: 5;
    }

    .track {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 76%;
      height: 100%;
      transform: translateX(-50%);
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(10,18,27,0.15));
      border: 6px solid rgba(255,255,255,0.28);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.18);
      background-image:
        linear-gradient(90deg, transparent 0 32.5%, rgba(255,255,255,0.38) 32.5% 33.5%, transparent 33.5% 66.5%, rgba(255,255,255,0.38) 66.5% 67.5%, transparent 67.5%),
        linear-gradient(180deg, #485f79, #26384a 22%, #1b2c3e 100%);
    }

    .road-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 28px,
        rgba(255,255,255,0.78) 28px,
        rgba(255,255,255,0.78) 54px
      );
      opacity: 0.7;
      animation: roadMove 0.7s linear infinite;
    }

    .road-objects {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .road-item {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0) scale(var(--scale, 1));
      display: grid;
      place-items: center;
      width: 104px;
      height: 64px;
      border-radius: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: white;
      text-shadow: 0 4px 0 rgba(20, 42, 80, 0.28);
      box-shadow: 0 12px 18px rgba(20, 42, 80, 0.15);
      border: 4px solid rgba(255,255,255,0.8);
      background: linear-gradient(180deg, #ff8fa5, #ff5a72);
      opacity: 0.98;
      transition: filter 0.12s ease;
    }

    .road-item.green { background: linear-gradient(180deg, #76e3a5, #35c875); }
    .road-item.blue { background: linear-gradient(180deg, #81d4ff, #4e9eea); }
    .road-item.gold { background: linear-gradient(180deg, #ffd46a, #ffb72c); }
    .road-item.purple { background: linear-gradient(180deg, #d7a9ff, #8d71ff); }
    .road-item.pink { background: linear-gradient(180deg, #ff99c7, #ff5ca6); }

    .player {
      position: absolute;
      bottom: 16%;
      left: 50%;
      width: 150px;
      height: 150px;
      transform: translateX(-50%);
      z-index: 12;
      animation: hover 1.25s ease-in-out infinite;
    }

    .rocket {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 110px;
      height: 124px;
      transform: rotate(-8deg);
      filter: drop-shadow(0 12px 18px rgba(10, 43, 86, 0.22));
    }

    .rocket .body-shell {
      position: absolute;
      left: 50%;
      top: 35px;
      width: 72px;
      height: 72px;
      transform: translateX(-50%);
      border-radius: 28% 28% 36% 36%;
      background: linear-gradient(180deg, #ff90b2, #ff4c7a 45%, #ff2e65 100%);
      border: 5px solid rgba(255,255,255,0.75);
    }

    .rocket .window {
      position: absolute;
      left: 50%;
      top: 50px;
      width: 32px;
      height: 32px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #d4f0ff 35%, #7fc7ff 60%, #2d7ee8 100%);
      border: 6px solid rgba(255,255,255,0.85);
    }

    .rocket .wing {
      position: absolute;
      bottom: 10px;
      width: 24px;
      height: 40px;
      border-radius: 14px 14px 18px 18px;
      background: linear-gradient(#ffd56a, #ffad2a);
      border: 5px solid rgba(255,255,255,0.72);
    }

    .rocket .wing.left { left: 12px; transform: rotate(-18deg); }
    .rocket .wing.right { right: 12px; transform: rotate(18deg); }

    .rocket .flame {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 18px;
      height: 30px;
      transform: translateX(-50%);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      background: linear-gradient(180deg, #fff4ba, #ffb65c 42%, #ff5d26 100%);
      animation: flicker 0.22s ease-in-out infinite alternate;
    }

    .tag {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      border: 4px solid rgba(255,255,255,0.85);
      font-weight: 900;
      font-size: 18px;
    }

    .speech-bubble {
      position: absolute;
      left: 50%;
      top: 102px;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(255,255,255,0.8);
      border: 4px solid rgba(255,255,255,0.85);
      border-radius: 22px;
      padding: 12px 18px;
      font-size: clamp(18px, 2vw, 30px);
      font-weight: 900;
      box-shadow: 0 12px 18px rgba(19, 69, 124, 0.15);
      text-align: center;
      max-width: 84%;
    }

    .target-word {
      position: absolute;
      left: 50%;
      top: 168px;
      transform: translateX(-50%);
      z-index: 25;
      min-width: 180px;
      min-height: 92px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      font-weight: 900;
      letter-spacing: 0.12em;
      font-size: clamp(52px, 6vw, 88px);
      color: white;
      text-shadow: 0 8px 0 rgba(60, 109, 180, 0.72), 0 14px 26px rgba(60, 92, 176, 0.24);
      background: linear-gradient(135deg, #ffb163, #ff7d7c, #7cb8ff);
      border: 8px solid rgba(255,255,255,0.85);
      box-shadow: 0 18px 34px rgba(52, 95, 170, 0.25), inset 0 8px 18px rgba(255,255,255,0.25);
      padding: 8px 18px;
      animation: wobble 2.2s ease-in-out infinite alternate;
    }

    .choices {
      position: absolute;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      width: min(92%, 820px);
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 18px;
      z-index: 26;
      padding: 0 14px;
    }

    .choice {
      position: relative;
      appearance: none;
      border: none;
      min-height: 150px;
      border-radius: 28px;
      padding: 10px 18px;
      font-size: clamp(28px, 2.8vw, 52px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: white;
      text-shadow: 0 6px 0 rgba(24, 61, 110, 0.2);
      cursor: pointer;
      box-shadow: 0 14px 20px rgba(21, 81, 145, 0.18), inset 0 8px 18px rgba(255,255,255,0.18);
      transition: transform 0.15s ease, filter 0.15s ease;
      animation: popIn 0.45s ease both;
    }

    .choice:nth-child(1) { background: linear-gradient(180deg, #ff9fc0, #ff5e82); }
    .choice:nth-child(2) { background: linear-gradient(180deg, #ffc272, #ff9f2a); }
    .choice:nth-child(3) { background: linear-gradient(180deg, #91d7ff, #4c9be8); }
    .choice:nth-child(4) { background: linear-gradient(180deg, #a5efb3, #58d082); }
    .choice:nth-child(5) { background: linear-gradient(180deg, #d8baff, #8d72ff); }
    .choice:nth-child(6) { background: linear-gradient(180deg, #ffd75f, #ffb139); }

    .choice:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.08); }
    .choice:active { transform: translateY(2px) scale(0.98); }

    .choice::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      height: 32%;
      border-radius: 16px 16px 50% 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.04));
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 25%, #ffe97f 60%, rgba(255,255,255,0) 100%);
      animation: sparkle 1.5s ease-out forwards;
      pointer-events: none;
      z-index: 35;
    }

    .combo-pop {
      position: absolute;
      font-weight: 900;
      color: #ff5f84;
      text-shadow: 0 4px 0 rgba(255,255,255,0.7);
      z-index: 40;
      animation: comboPop 1.1s ease-out forwards;
      pointer-events: none;
    }

    .wrong {
      animation: shake 0.35s ease-in-out 2;
    }

    .toast {
      position: absolute;
      right: 30px;
      bottom: 30px;
      max-width: 300px;
      background: rgba(255,255,255,0.82);
      border: 4px solid rgba(255,255,255,0.85);
      border-radius: 22px;
      padding: 12px 16px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(11, 60, 120, 0.15);
      z-index: 40;
      animation: popIn 0.4s ease;
    }

    .skin-strip {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .skin-item {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: 0 6px 12px rgba(0,0,0,0.12);
      cursor: pointer;
      opacity: 0.5;
    }

    .skin-item.unlocked { opacity: 1; }

    .skin-item.active {
      box-shadow: 0 0 0 4px rgba(255,255,255,0.85), 0 0 0 8px rgba(255,205,81,0.35);
    }

    @keyframes sunGlow {
      from { box-shadow: 0 0 28px rgba(255, 190, 42, 0.75); }
      to { box-shadow: 0 0 60px rgba(255, 190, 42, 1), 0 0 90px rgba(255, 175, 75, 0.7); }
    }

    @keyframes drift {
      from { transform: translateX(-14px); }
      to { transform: translateX(18px); }
    }

    @keyframes roadMove {
      from { transform: translateY(0); }
      to { transform: translateY(50px); }
    }

    @keyframes hover {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }

    @keyframes flicker {
      from { transform: translateX(-50%) scaleY(1); opacity: 0.9; }
      to { transform: translateX(-50%) scaleY(1.25); opacity: 1; }
    }

    @keyframes wobble {
      0% { transform: translateX(-50%) rotateX(8deg) rotateY(-8deg) translateY(0); }
      100% { transform: translateX(-50%) rotateX(-8deg) rotateY(8deg) translateY(-8px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0.4) translateY(0); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.7) translateY(-28px); }
    }

    @keyframes comboPop {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.7); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-8px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @media (max-width: 760px) {
      .choices {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        bottom: 28px;
      }
      .track-wrap {
        width: min(82vw, 520px);
      }
      .target-word {
        min-width: 150px;
      }
      .panel {
        top: 120px;
        left: 14px;
        right: 14px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="hud">
      <div class="pill">Stars <span class="star" id="stars">0</span></div>
      <div class="pill streak-box">Streak <span id="streak">0</span></div>
      <div class="pill">Level <span id="level">1</span></div>
      <div class="pill">Best <span id="bestScore">0</span></div>
    </div>

    <div class="race-meter">
      <div class="race-fill" id="raceFill"></div>
      <div class="race-finish">FINISH</div>
    </div>

    <div class="panel">
      <h4>Power Ups</h4>
      <div class="powerups">
        <button class="power-btn boost" data-power="boost">⚡ Boost</button>
        <button class="power-btn shield" data-power="shield">🛡 Shield</button>
        <button class="power-btn double" data-power="double">✨ Double</button>
      </div>
      <h4 style="margin-top: 12px;">Rocket Skins</h4>
      <div class="skin-strip" id="skins"></div>
      <div style="margin-top: 12px; font-size: 15px; font-weight: 900;">Daily Challenge: <span id="dailyGoal">50</span></div>
      <div style="margin-top: 8px; font-size: 15px; font-weight: 900;">Endless Mode: <span id="endlessStatus">Off</span></div>
    </div>

    <div class="scene">
      <div class="sun"></div>
      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="cloud three"></div>

      <div class="speech-bubble" id="message">Ready to read and race?</div>
      <div class="target-word" id="targetWord">CAT</div>

      <div class="track-wrap">
        <div class="track">
          <div class="road-lines"></div>
          <div class="road-objects" id="roadObjects"></div>
        </div>
      </div>

      <div class="player" id="player">
        <div class="rocket" id="rocketBody">
          <div class="body-shell"></div>
          <div class="window"></div>
          <div class="wing left"></div>
          <div class="wing right"></div>
          <div class="flame"></div>
        </div>
        <div class="tag">GO!</div>
      </div>

      <div class="choices" id="choices"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'readingRocketRace_v3';
    const skinPalette = {
      sun: ['#ffdd63', '#ff9f43', '#ff5d7b'],
      moon: ['#d9d6ff', '#8d8cff', '#5a77ff'],
      aqua: ['#9ae6ff', '#61d7ff', '#2eb6ff'],
      green: ['#9df5b1', '#54d87b', '#31b65a'],
      candy: ['#ffb4d9', '#ff7ab3', '#ff4d8d'],
      fire: ['#ffc583', '#ff8f4f', '#ff5a3d']
    };

    const state = loadState();
    let currentRound = null;
    let roundIndex = 0;
    let isAnswering = false;
    let distance = 0;
    let lastToastTimer = 0;

    const levels = [
      { prompt: 'Find the word', target: 'CAT', choices: ['CAT', 'DOG', 'SUN'], answer: 'CAT' },
      { prompt: 'Find the word', target: 'DOG', choices: ['CAT', 'DOG', 'BOX'], answer: 'DOG' },
      { prompt: 'Find the word', target: 'SUN', choices: ['SUN', 'RUN', 'MAP'], answer: 'SUN' },
      { prompt: 'Find the word', target: 'BOOK', choices: ['TOY', 'BOOK', 'BALL'], answer: 'BOOK' },
      { prompt: 'Find the word', target: 'FISH', choices: ['FISH', 'BIRD', 'TREE'], answer: 'FISH' },
      { prompt: 'Find the word', target: 'RED', choices: ['RED', 'BLUE', 'GREEN'], answer: 'RED' },
      { prompt: 'Find the word', target: 'JUMP', choices: ['JUMP', 'HIDE', 'SLEEP'], answer: 'JUMP' },
      { prompt: 'Find the word', target: 'STAR', choices: ['STAR', 'MOON', 'RAIN'], answer: 'STAR' },
      { prompt: 'Find the letter', target: 'M', choices: ['S', 'M', 'T'], answer: 'M' },
      { prompt: 'Find the letter', target: 'A', choices: ['D', 'A', 'P'], answer: 'A' },
      { prompt: 'Find the letter', target: 'B', choices: ['B', 'L', 'F'], answer: 'B' },
      { prompt: 'Find the letter', target: 'R', choices: ['C', 'R', 'N'], answer: 'R' },
      { prompt: 'Find the word', target: 'MOON', choices: ['MOON', 'ROCK', 'RAIN'], answer: 'MOON' },
      { prompt: 'Find the word', target: 'PLAY', choices: ['PLAY', 'WORK', 'REST'], answer: 'PLAY' },
      { prompt: 'Find the word', target: 'TREE', choices: ['TREE', 'ROCK', 'DOOR'], answer: 'TREE' },
      { prompt: 'Boss word', target: 'ROCKET', choices: ['ROCKET', 'GARDEN', 'WINDOW'], answer: 'ROCKET' },
      { prompt: 'Boss word', target: 'BRIGHT', choices: ['LIGHT', 'BRIGHT', 'BLOOM'], answer: 'BRIGHT' },
      { prompt: 'Boss word', target: 'READ', choices: ['READ', 'SWIM', 'RUN'], answer: 'READ' }
    ];

    const starsEl = document.getElementById('stars');
    const streakEl = document.getElementById('streak');
    const levelEl = document.getElementById('level');
    const bestScoreEl = document.getElementById('bestScore');
    const targetWordEl = document.getElementById('targetWord');
    const messageEl = document.getElementById('message');
    const choicesEl = document.getElementById('choices');
    const raceFill = document.getElementById('raceFill');
    const roadObjectsEl = document.getElementById('roadObjects');
    const skinsEl = document.getElementById('skins');
    const dailyGoalEl = document.getElementById('dailyGoal');
    const endlessStatusEl = document.getElementById('endlessStatus');
    const rocketBody = document.getElementById('rocketBody');

    function defaultState() {
      return {
        stars: 0,
        best: 0,
        streak: 0,
        level: 1,
        endless: false,
        dailyStamp: '',
        dailyProgress: 0,
        powerups: {
          boost: 0,
          shield: 0,
          double: 0
        },
        unlocked: ['sun'],
        activeSkin: 'sun',
        achievements: [],
        leaderboard: []
      };
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      try {
        const parsed = JSON.parse(raw);
        return { ...defaultState(), ...parsed, powerups: { ...defaultState().powerups, ...(parsed.powerups || {}) } };
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function applyActiveSkin() {
      const active = skinPalette[state.activeSkin] || skinPalette.sun;
      rocketBody.style.filter = 'drop-shadow(0 12px 18px rgba(10, 43, 86, 0.22))';
      const shell = rocketBody.querySelector('.body-shell');
      const wingLeft = rocketBody.querySelector('.wing.left');
      const wingRight = rocketBody.querySelector('.wing.right');
      const flame = rocketBody.querySelector('.flame');
      if (shell) shell.style.background = `linear-gradient(180deg, ${active[0]}, ${active[1]} 45%, ${active[2]} 100%)`;
      if (wingLeft) wingLeft.style.background = `linear-gradient(#ffd56a, ${active[2]})`;
      if (wingRight) wingRight.style.background = `linear-gradient(#ffd56a, ${active[2]})`;
      if (flame) flame.style.background = `linear-gradient(180deg, #fff4ba, #ffb65c 42%, ${active[2]} 100%)`;
    }

    function updateHud() {
      starsEl.textContent = String(state.stars);
      streakEl.textContent = String(state.streak);
      levelEl.textContent = String(state.level);
      bestScoreEl.textContent = String(state.best);
      dailyGoalEl.textContent = String(getDailyGoal());
      endlessStatusEl.textContent = state.endless ? 'On' : 'Off';
      updateDistanceMeter();
      renderSkins();
      applyActiveSkin();
    }

    function getDailyGoal() {
      const today = new Date();
      const base = 40 + (today.getDate() % 10) * 10;
      return base;
    }

    function renderSkins() {
      const skins = Object.keys(skinPalette);
      skinsEl.innerHTML = '';
      skins.forEach((name) => {
        const item = document.createElement('div');
        item.className = 'skin-item' + (state.unlocked.includes(name) ? ' unlocked' : '') + (state.activeSkin === name ? ' active' : '');
        item.title = name;
        const [a, b, c] = skinPalette[name];
        item.style.background = `linear-gradient(135deg, ${a}, ${b}, ${c})`;
        if (state.unlocked.includes(name)) {
          item.addEventListener('click', () => {
            state.activeSkin = name;
            saveState();
            applyActiveSkin();
            renderSkins();
          });
        }
        skinsEl.appendChild(item);
      });
    }

    function addToast(message) {
      const oldToast = document.querySelector('.toast');
      if (oldToast) oldToast.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.querySelector('.game').appendChild(toast);
      clearTimeout(lastToastTimer);
      lastToastTimer = setTimeout(() => toast.remove(), 1800);
    }

    function unlockIfNeeded() {
      const conditions = [
        { skin: 'moon', min: 40 },
        { skin: 'aqua', min: 90 },
        { skin: 'green', min: 150 },
        { skin: 'candy', min: 220 },
        { skin: 'fire', min: 300 }
      ];
      conditions.forEach(({ skin, min }) => {
        if (state.stars >= min && !state.unlocked.includes(skin)) {
          state.unlocked.push(skin);
          addToast(`Unlocked ${skin}!`);
        }
      });
      if (state.stars >= 150 && !state.achievements.includes('reader')) {
        state.achievements.push('reader');
        addToast('Achievement: Reading Hero!');
      }
      if (state.streak >= 5 && !state.achievements.includes('streak')) {
        state.achievements.push('streak');
        addToast('Achievement: Streak Star!');
      }
      if (state.level >= 8 && !state.achievements.includes('pilot')) {
        state.achievements.push('pilot');
        addToast('Achievement: Rocket Pilot!');
      }
    }

    function updateDistanceMeter() {
      const pct = Math.min(distance, 100);
      raceFill.style.width = pct + '%';
    }

    function spawnRoadObjects() {
      roadObjectsEl.innerHTML = '';
      const laneValues = [-120, 0, 130];
      for (let i = 0; i < 6; i++) {
        const item = document.createElement('div');
        const colors = ['pink', 'green', 'blue', 'gold', 'purple'];
        item.className = 'road-item ' + colors[Math.floor(Math.random() * colors.length)];
        const lane = laneValues[Math.floor(Math.random() * laneValues.length)];
        const scale = 0.82 + Math.random() * 0.8;
        item.style.left = `calc(50% + ${lane}px)`;
        item.style.top = `${30 + i * 11}%`;
        item.style.setProperty('--scale', scale);
        item.textContent = ['GO', 'WOW', 'YAY', 'ZIP', 'HOP', 'RUN'][Math.floor(Math.random() * 6)];
        item.dataset.y = String(30 + i * 11);
        roadObjectsEl.appendChild(item);
      }
    }

    function animateRoad() {
      const items = [...document.querySelectorAll('.road-item')];
      items.forEach((item, index) => {
        let y = Number(item.dataset.y || 30 + index * 11);
        y += 0.85 + index * 0.1;
        if (y > 110) {
          y = 10;
          item.style.left = `${50 + (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 120)}%`;
          item.textContent = ['GO', 'WOW', 'YAY', 'ZIP', 'HOP', 'RUN'][Math.floor(Math.random() * 6)];
        }
        item.dataset.y = String(y);
        item.style.top = `${y}%`;
        item.style.opacity = y > 108 ? '0' : '1';
      });
      requestAnimationFrame(animateRoad);
    }

    function makeSparkles() {
      for (let i = 0; i < 16; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = `${Math.random() * 80 + 10}%`;
        s.style.top = `${Math.random() * 55 + 15}%`;
        s.style.animationDelay = `${Math.random() * 0.3}s`;
        document.querySelector('.scene').appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
    }

    function showComboPop(text, x, y) {
      const pop = document.createElement('div');
      pop.className = 'combo-pop';
      pop.textContent = text;
      pop.style.left = `${x}px`;
      pop.style.top = `${y}px`;
      pop.style.fontSize = '30px';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1200);
    }

    function getDailyProgress() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.dailyStamp !== today) {
        state.dailyStamp = today;
        state.dailyProgress = 0;
      }
      return state.dailyProgress;
    }

    function updateDailyProgress() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.dailyStamp !== today) {
        state.dailyStamp = today;
        state.dailyProgress = 0;
      }
      const goal = getDailyGoal();
      dailyGoalEl.textContent = `${state.dailyProgress}/${goal}`;
    }

    function chooseRound() {
      const bossEvery = 5;
      const useBoss = roundIndex > 0 && roundIndex % bossEvery === 0;
      let pick = levels[Math.floor(Math.random() * levels.length)];
      if (useBoss) {
        const bossPool = levels.filter(item => item.prompt === 'Boss word');
        if (bossPool.length) pick = bossPool[Math.floor(Math.random() * bossPool.length)];
      }
      currentRound = pick;
      const options = shuffle(pick.choices);
      targetWordEl.textContent = pick.target;
      messageEl.textContent = pick.prompt;
      choicesEl.innerHTML = '';
      options.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'choice';
        btn.textContent = choice;
        btn.style.animationDelay = `${idx * 120}ms`;
        btn.addEventListener('click', () => handleAnswer(choice, btn));
        choicesEl.appendChild(btn);
      });
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function applyPower(power) {
      if (power === 'boost') {
        state.powerups.boost = 2;
        addToast('Boost ready!');
      }
      if (power === 'shield') {
        state.powerups.shield = 2;
        addToast('Shield ready!');
      }
      if (power === 'double') {
        state.powerups.double = 2;
        addToast('Double stars!');
      }
      saveState();
    }

    document.querySelectorAll('[data-power]').forEach((btn) => {
      btn.addEventListener('click', () => applyPower(btn.dataset.power));
    });

    function handleAnswer(choice, btn) {
      if (isAnswering) return;
      isAnswering = true;
      const buttons = [...document.querySelectorAll('.choice')];
      buttons.forEach(b => b.disabled = true);

      const correct = choice === currentRound.answer;
      if (correct) {
        let gain = 10;
        if (state.powerups.boost > 0) gain += 8;
        if (state.powerups.double > 0) gain *= 2;
        if (state.powerups.boost > 0) state.powerups.boost -= 1;
        if (state.powerups.double > 0) state.powerups.double -= 1;

        state.streak += 1;
        state.stars += gain;
        state.best = Math.max(state.best, state.stars);

        if (state.streak >= 3) {
          messageEl.textContent = 'Hot streak!';
          showComboPop(`${state.streak}x Combo!`, window.innerWidth / 2 - 80, window.innerHeight / 3);
        } else {
          messageEl.textContent = 'You did it!';
        }

        if (state.streak % 5 === 0) {
          distance = Math.min(100, distance + 30);
          makeSparkles();
          showComboPop('BOOST!', window.innerWidth / 2 - 80, window.innerHeight / 3 + 30);
          addToast('Milestone!');
        } else {
          distance = Math.min(100, distance + 18);
        }

        if (state.streak >= 8) {
          state.endless = true;
          endlessStatusEl.textContent = 'On';
        }

        state.level = Math.max(1, Math.floor(state.stars / 40) + 1);
        unlockIfNeeded();
        state.dailyProgress += 1;
        updateDailyProgress();

        if (distance >= 100) {
          state.endless = true;
          endlessStatusEl.textContent = 'On';
          distance = 0;
          messageEl.textContent = 'Finish line! Endless mode unlocked!';
          addToast('Endless mode unlocked!');
        }

        updateHud();
        saveState();
        makeSparkles();
      } else {
        if (state.powerups.shield > 0) {
          state.powerups.shield -= 1;
          messageEl.textContent = 'Shield saved you!';
          addToast('Shield used!');
        } else {
          state.streak = 0;
          distance = Math.max(0, distance - 12);
          messageEl.textContent = 'Nice try! Keep going!';
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 700);
        }
        updateHud();
        saveState();
      }

      setTimeout(() => {
        roundIndex += 1;
        isAnswering = false;
        chooseRound();
        updateHud();
      }, 900);
    }

    function initialLoad() {
      const today = new Date().toISOString().slice(0, 10);
      if (state.dailyStamp !== today) {
        state.dailyStamp = today;
        state.dailyProgress = 0;
      }
      state.best = Math.max(state.best || 0, state.stars || 0);
      updateHud();
      renderSkins();
      applyActiveSkin();
      spawnRoadObjects();
      animateRoad();
      chooseRound();
      updateDailyProgress();
    }

    initialLoad();
  </script>
</body>
</html>
