<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Rocket Race 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      background: #333;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      pointer-events: none;
    }

    .pill {
      background: rgba(255,255,255,0.85);
      border: 4px solid rgba(255,255,255,0.9);
      border-radius: 999px;
      font-weight: 900;
      font-size: clamp(18px, 2vw, 26px);
      padding: 12px 20px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(#ffe16d, #ffba18);
      font-size: 18px;
      box-shadow: inset 0 -3px 7px rgba(0,0,0,0.08);
    }

    .word-prompt {
      position: absolute;
      left: 50%;
      top: 100px;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255,255,255,0.88);
      border: 6px solid rgba(255,255,255,0.9);
      border-radius: 28px;
      padding: 14px 26px;
      font-weight: 900;
      font-size: clamp(26px, 3vw, 48px);
      letter-spacing: 0.08em;
      color: white;
      text-shadow: 0 8px 0 rgba(60, 109, 180, 0.72);
      background: linear-gradient(135deg, #ffb163, #ff7d7c, #7cb8ff);
      box-shadow: 0 18px 34px rgba(52, 95, 170, 0.25);
      min-width: 200px;
      text-align: center;
      animation: wobble 2.2s ease-in-out infinite alternate;
    }

    .choices-panel {
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      width: min(90%, 820px);
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 16px;
      z-index: 30;
      pointer-events: all;
      padding: 0 12px;
    }

    .choice-btn {
      appearance: none;
      border: none;
      border-radius: 24px;
      padding: 12px 14px;
      font-size: clamp(28px, 2.8vw, 50px);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: white;
      text-shadow: 0 6px 0 rgba(24, 61, 110, 0.2);
      cursor: pointer;
      box-shadow: 0 14px 20px rgba(21, 81, 145, 0.18);
      transition: transform 0.15s ease, filter 0.15s ease;
      min-height: 140px;
      animation: popIn 0.45s ease both;
    }

    .choice-btn:nth-child(1) { background: linear-gradient(180deg, #ff9fc0, #ff5e82); }
    .choice-btn:nth-child(2) { background: linear-gradient(180deg, #ffc272, #ff9f2a); }
    .choice-btn:nth-child(3) { background: linear-gradient(180deg, #91d7ff, #4c9be8); }

    .choice-btn:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.08); }
    .choice-btn:active { transform: translateY(2px) scale(0.98); }

    .toast {
      position: absolute;
      right: 30px;
      bottom: 30px;
      background: rgba(255,255,255,0.85);
      border: 4px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 14px 18px;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      z-index: 40;
      animation: popIn 0.4s ease;
    }

    @keyframes wobble {
      0% { transform: translateX(-50%) rotateX(8deg) rotateY(-8deg) translateY(0); }
      100% { transform: translateX(-50%) rotateX(-8deg) rotateY(8deg) translateY(-8px); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 760px) {
      .choices-panel {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
        bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="pill">Stars <span class="star" id="stars">0</span></div>
    <div class="pill">Level <span id="level">1</span></div>
    <div class="pill">Streak <span id="streak">0</span></div>
  </div>

  <div class="word-prompt" id="wordPrompt">CAT</div>

  <div class="choices-panel" id="choicesPanel"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 3D Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x70d9ff);
    scene.fog = new THREE.Fog(0x70d9ff, 500, 1200);

    const canvas = document.getElementById('canvas');
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 25, -60);
    camera.lookAt(0, 20, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowShadowMap;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(100, 100, 100);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.far = 500;
    directionalLight.shadow.camera.left = -200;
    directionalLight.shadow.camera.right = 200;
    directionalLight.shadow.camera.top = 200;
    directionalLight.shadow.camera.bottom = -200;
    scene.add(directionalLight);

    // Sky/Background
    const skyGeom = new THREE.SphereGeometry(800, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({
      color: 0xbaf0ff,
      side: THREE.BackSide
    });
    const sky = new THREE.Mesh(skyGeom, skyMat);
    scene.add(sky);

    // Sun
    const sunGeom = new THREE.SphereGeometry(40, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeom, sunMat);
    sun.position.set(200, 150, -300);
    scene.add(sun);

    const sunLight = new THREE.PointLight(0xffaa44, 0.6, 800);
    sunLight.position.copy(sun.position);
    scene.add(sunLight);

    // Ground/Grass
    const groundGeom = new THREE.PlaneGeometry(800, 400);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x71d778 });
    const ground = new THREE.Mesh(groundGeom, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // Road/Track
    const roadGeom = new THREE.PlaneGeometry(120, 600);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x3a4a5a });
    const road = new THREE.Mesh(roadGeom, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.01;
    road.receiveShadow = true;
    scene.add(road);

    // Road lane dividers
    const laneGeom = new THREE.PlaneGeometry(4, 600);
    const laneMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const laneL = new THREE.Mesh(laneGeom, laneMat);
    laneL.rotation.x = -Math.PI / 2;
    laneL.position.set(-40, 0.02, 0);
    laneL.receiveShadow = true;
    scene.add(laneL);

    const laneR = new THREE.Mesh(laneGeom, laneMat);
    laneR.rotation.x = -Math.PI / 2;
    laneR.position.set(40, 0.02, 0);
    laneR.receiveShadow = true;
    scene.add(laneR);

    // Rocket player
    const rocketGroup = new THREE.Group();
    rocketGroup.position.set(0, 8, 80);

    const bodyGeom = new THREE.ConeGeometry(8, 30, 8);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff5a7f, shininess: 100 });
    const body = new THREE.Mesh(bodyGeom, bodyMat);
    body.castShadow = true;
    body.receiveShadow = true;
    rocketGroup.add(body);

    const windowGeom = new THREE.SphereGeometry(4, 16, 16);
    const windowMat = new THREE.MeshPhongMaterial({ color: 0x4e9be9, shininess: 120 });
    const window_mesh = new THREE.Mesh(windowGeom, windowMat);
    window_mesh.position.y = 5;
    window_mesh.castShadow = true;
    window_mesh.receiveShadow = true;
    rocketGroup.add(window_mesh);

    const wingGeom = new THREE.BoxGeometry(6, 2, 16);
    const wingMat = new THREE.MeshPhongMaterial({ color: 0xffd46a });
    const wingL = new THREE.Mesh(wingGeom, wingMat);
    wingL.position.set(-10, 2, 0);
    wingL.castShadow = true;
    wingL.receiveShadow = true;
    rocketGroup.add(wingL);

    const wingR = new THREE.Mesh(wingGeom, wingMat);
    wingR.position.set(10, 2, 0);
    wingR.castShadow = true;
    wingR.receiveShadow = true;
    rocketGroup.add(wingR);

    const flameGeom = new THREE.ConeGeometry(5, 20, 8);
    const flameMat = new THREE.MeshPhongMaterial({ color: 0xff6b2a, emissive: 0xff4400 });
    const flame = new THREE.Mesh(flameGeom, flameMat);
    flame.position.y = -18;
    flame.castShadow = true;
    rocketGroup.add(flame);

    scene.add(rocketGroup);

    // Game State
    const levels = [
      { prompt: 'Find the word', target: 'CAT', choices: ['CAT', 'DOG', 'SUN'], answer: 'CAT' },
      { prompt: 'Find the word', target: 'DOG', choices: ['CAT', 'DOG', 'BOX'], answer: 'DOG' },
      { prompt: 'Find the word', target: 'SUN', choices: ['SUN', 'RUN', 'MAP'], answer: 'SUN' },
      { prompt: 'Find the word', target: 'BOOK', choices: ['TOY', 'BOOK', 'BALL'], answer: 'BOOK' },
      { prompt: 'Find the word', target: 'FISH', choices: ['FISH', 'BIRD', 'TREE'], answer: 'FISH' },
      { prompt: 'Find the word', target: 'RED', choices: ['RED', 'BLUE', 'GREEN'], answer: 'RED' },
      { prompt: 'Find the word', target: 'JUMP', choices: ['JUMP', 'HIDE', 'SLEEP'], answer: 'JUMP' },
      { prompt: 'Find the word', target: 'STAR', choices: ['STAR', 'MOON', 'RAIN'], answer: 'STAR' },
      { prompt: 'Find the letter', target: 'M', choices: ['S', 'M', 'T'], answer: 'M' },
      { prompt: 'Find the letter', target: 'A', choices: ['D', 'A', 'P'], answer: 'A' },
      { prompt: 'Find the letter', target: 'B', choices: ['B', 'L', 'F'], answer: 'B' },
      { prompt: 'Find the word', target: 'MOON', choices: ['MOON', 'ROCK', 'RAIN'], answer: 'MOON' },
      { prompt: 'Find the word', target: 'PLAY', choices: ['PLAY', 'WORK', 'REST'], answer: 'PLAY' },
      { prompt: 'Find the word', target: 'TREE', choices: ['TREE', 'ROCK', 'DOOR'], answer: 'TREE' }
    ];

    let state = {
      stars: 0,
      level: 1,
      streak: 0,
      distance: 0
    };

    let currentRound = null;
    let isAnswering = false;
    let wordBoxes = [];

    function createWordBox(text, x, z) {
      const boxGeom = new THREE.BoxGeometry(25, 15, 8);
      const boxMat = new THREE.MeshPhongMaterial({ color: 0xff8fa5 });
      const box = new THREE.Mesh(boxGeom, boxMat);
      box.position.set(x, 12, z);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);

      const canvas_txt = document.createElement('canvas');
      canvas_txt.width = 512;
      canvas_txt.height = 256;
      const ctx = canvas_txt.getContext('2d');
      ctx.fillStyle = 'white';
      ctx.font = 'bold 120px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 128);

      const texture = new THREE.CanvasTexture(canvas_txt);
      const faceMat = new THREE.MeshPhongMaterial({ map: texture });
      box.material = faceMat;

      box.userData = { type: 'word', text, z };
      wordBoxes.push(box);
      return box;
    }

    function spawnWordBoxes() {
      wordBoxes.forEach(box => scene.remove(box));
      wordBoxes = [];

      const lanes = [-40, 0, 40];
      for (let i = 0; i < 8; i++) {
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        const z = -100 - i * 80;
        const text = ['GO', 'WOW', 'YAY', 'ZIP', 'HOP', 'RUN'][Math.floor(Math.random() * 6)];
        createWordBox(text, lane, z);
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildRound() {
      if (isAnswering) return;
      const item = levels[Math.floor(Math.random() * levels.length)];
      currentRound = item;

      document.getElementById('wordPrompt').textContent = item.target;
      const choicesPanel = document.getElementById('choicesPanel');
      choicesPanel.innerHTML = '';

      const options = shuffle(item.choices);
      options.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice;
        btn.style.animationDelay = `${idx * 120}ms`;
        btn.addEventListener('click', () => handleAnswer(choice, btn));
        choicesPanel.appendChild(btn);
      });
    }

    function handleAnswer(choice, btn) {
      if (isAnswering) return;
      isAnswering = true;

      const buttons = [...document.querySelectorAll('.choice-btn')];
      buttons.forEach(b => b.disabled = true);

      const correct = choice === currentRound.answer;
      if (correct) {
        state.stars += 10;
        state.streak += 1;
        state.distance += 25;
        state.level = Math.max(1, Math.floor(state.stars / 40) + 1);

        document.getElementById('stars').textContent = state.stars;
        document.getElementById('streak').textContent = state.streak;
        document.getElementById('level').textContent = state.level;

        rocketGroup.position.z -= 30;
        addToast('Awesome!');

        if (state.streak % 5 === 0) {
          addToast(`${state.streak}x Combo!`);
        }
      } else {
        state.streak = 0;
        state.distance = Math.max(0, state.distance - 12);
        document.getElementById('streak').textContent = '0';
        addToast('Try again!');
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 700);
      }

      setTimeout(() => {
        isAnswering = false;
        buildRound();
      }, 900);
    }

    function addToast(message) {
      const oldToast = document.querySelector('.toast');
      if (oldToast) oldToast.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1600);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Move rocket forward
      rocketGroup.position.z -= 0.3;

      // Camera follow rocket
      camera.position.x = rocketGroup.position.x * 0.3;
      camera.position.y = rocketGroup.position.y + 15;
      camera.position.z = rocketGroup.position.z - 50;
      camera.lookAt(rocketGroup.position);

      // Animate flame
      const flame = rocketGroup.children[4];
      if (flame) {
        flame.scale.y = 1 + Math.sin(Date.now() * 0.005) * 0.3;
      }

      // Move word boxes toward rocket
      wordBoxes.forEach(box => {
        if (box.position.z > rocketGroup.position.z + 100) {
          box.position.z -= 3;
        } else if (box.position.z < rocketGroup.position.z - 100) {
          scene.remove(box);
          const lanes = [-40, 0, 40];
          const lane = lanes[Math.floor(Math.random() * lanes.length)];
          createWordBox('GO', lane, rocketGroup.position.z - 200);
        }
      });

      // Rotate rocket slightly
      rocketGroup.rotation.z = Math.sin(Date.now() * 0.001) * 0.1;

      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize
    spawnWordBoxes();
    buildRound();
    animate();
  </script>
</body>
</html>
